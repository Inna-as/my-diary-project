{% extends 'blog/base.html' %}

{% block content %}
<div class="card card--centered">
    <h3 class="card-title" style="text-align: center;">🔐 Вход</h3>

    <form method="post" action=".">
        {% csrf_token %}

        {% for field in form %}
        <div class="form-group">
            <label>{{ field.label }}</label>
            {{ field }}
            {% if field.errors %}
            <small style="color: var(--red);">{{ field.errors.0 }}</small>
            {% endif %}
        </div>
        {% endfor %}

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 8px;">Войти</button>
    </form>

    <p style="text-align: center; margin-top: 16px; color: var(--text-light); font-size: 0.85rem;">
        Нет аккаунта? <a href="{% url 'blog:register' %}" style="color: var(--accent);">Зарегистрироваться</a>
    </p>
</div>
{% endblock %}
