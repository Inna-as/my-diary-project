{% extends 'blog/base.html' %}
{% load static %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <h1 class="mb-4">{% if form.instance.pk %}Редактировать{% else %}Создать{% endif %} рецепт</h1>

            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}

                <div class="mb-3">
                    <label class="form-label">{{ form.title.label }}</label>
                    {{ form.title }}
                </div>

                <div class="mb-3">
                    <label class="form-label">{{ form.description.label }}</label>
                    {{ form.description }}
                </div>

                <div class="mb-3">
                    <label class="form-label">{{ form.category.label }}</label>
                    {{ form.category }}
                </div>

                <div class="mb-3">
                    <label class="form-label">{{ form.image.label }}</label>
                    {{ form.image }}
                </div>

                <div class="mb-3">
                    <label class="form-label">{{ form.instructions.label }}</label>
                    {{ form.instructions }}
                </div>

                <button type="submit" class="btn btn-primary btn-lg px-5 rounded-pill">
                    {% if form.instance.pk %}Сохранить{% else %}Опубликовать{% endif %}
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
