{% extends 'blog/base.html' %}

{% block content %}
<div class="card card--centered" style="text-align: center; max-width: 500px;">
    <h3 class="card-title" style="color: var(--red); margin-bottom: 12px;">🗑 Удалить запись?</h3>

    <p style="color: var(--text-light);">
        Вы уверены, что хотите навсегда удалить рецепт<br>
        <strong style="color: var(--text);">«{{ article.title }}»</strong>?
    </p>

    <form method="post" action=".">
        {% csrf_token %}
        <div style="display: flex; gap: 12px; justify-content: center; margin-top: 20px;">
            <button type="submit" class="btn btn-danger">Да, удалить</button>
            <a href="{% url 'blog:article_detail' article.pk %}" class="btn btn-outline">Отмена</a>
        </div>
    </form>
</div>
{% endblock %}
