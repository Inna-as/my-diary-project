{% extends 'blog/base.html' %}

{% block content %}
<div class="card card--centered">
    <h3 class="card-title" style="text-align: center;">📝 Регистрация</h3>

    <form method="post" action=".">
        {% csrf_token %}

        {% for field in form %}
        <div class="form-group">
            <label>{{ field.label }}</label>
            {{ field }}
            {% if field.help_text %}
            <small style="color: var(--text-light);">{{ field.help_text }}</small>
            {% endif %}
            {% for error in field.errors %}
            <small style="color: var(--red); display: block;">{{ error }}</small>
            {% endfor %}
        </div>
        {% endfor %}

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 8px;">Зарегистрироваться</button>
    </form>

    <p style="text-align: center; margin-top: 16px; color: var(--text-light); font-size: 0.85rem;">
        Уже есть аккаунт? <a href="{% url 'login' %}" style="color: var(--accent);">Войти</a>
    </p>
</div>
{% endblock %}
